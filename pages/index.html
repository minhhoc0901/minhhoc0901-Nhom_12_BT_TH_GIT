<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sách</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (Optional for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .book-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .book-image {
            height: 250px;
            object-fit: cover;
        }

        .price-tag {
            font-size: 1.2rem;
            font-weight: bold;
            color: #dc3545;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-book"></i> Quản Lý Sách
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Danh sách sách</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="mb-4">
            <h1 class="text-primary">
                <i class="fas fa-book-open"></i> Danh Sách Sách
            </h1>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center my-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Đang tải...</span>
            </div>
        </div>

        <!-- Books Grid -->
        <div id="booksList" class="row g-4"></div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center my-5 d-none">
            <i class="fas fa-book-open fa-5x text-muted mb-3"></i>
            <h3 class="text-muted">Chưa có sách nào</h3>
            <p class="text-muted">Hãy thêm sách mới để bắt đầu quản lý thư viện của bạn</p>
        </div>
    </div>



    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Action JS -->
    <script src="../action.js"></script>
    <script>
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function () {
            loadBooks();
        });

        // Load and display books
        async function loadBooks() {
            const loadingSpinner = document.getElementById('loadingSpinner');
            const booksList = document.getElementById('booksList');
            const emptyState = document.getElementById('emptyState');

            try {
                loadingSpinner.classList.remove('d-none');
                booksList.innerHTML = '';
                emptyState.classList.add('d-none');

                const books = await getAllBooks();

                if (books.length === 0) {
                    emptyState.classList.remove('d-none');
                } else {
                    books.forEach(book => {
                        const bookCard = createBookCard(book);
                        booksList.innerHTML += bookCard;
                    });
                }
            } catch (error) {
                console.error('Error loading books:', error);
                booksList.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle"></i> 
                            Không thể tải danh sách sách. Vui lòng kiểm tra server!
                        </div>
                    </div>
                `;
            } finally {
                loadingSpinner.classList.add('d-none');
            }
        }

        // Create book card HTML
        function createBookCard(book) {
            return `
                <div class="col-md-4 col-lg-3">
                    <div class="card book-card h-100">
                        <img src="${book.image}" class="card-img-top book-image" alt="${book.title}">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${book.title}</h5>
                            <p class="card-text text-muted small">
                                <i class="fas fa-user"></i> ${book.author}
                            </p>
                            <p class="card-text small text-truncate" title="${book.description}">
                                ${book.description}
                            </p>
                            <p class="card-text">
                                <span class="badge bg-info">${book.category}</span>
                            </p>
                            <div class="mt-auto">
                                <p class="price-tag mb-2">${formatPrice(book.price)} đ</p>
                                <a href="book_detail.html?id=${book.id}" class="btn btn-primary w-100">
                                    <i class="fas fa-eye"></i> Xem chi tiết
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Format price with thousands separator
        function formatPrice(price) {
            return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }
    </script>
</body>

</html>
