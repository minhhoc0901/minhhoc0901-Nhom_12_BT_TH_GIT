<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

    <div class="container mt-4">
        <h1 class="text-center text-primary">Hệ Thống Quản Lý Sách</h1>
        <div class="alert alert-success text-center" role="alert">
            Bootstrap đã được tích hợp thành công!
        </div>




        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal">
            <i class="fa fa-plus"></i> Thêm Sản Phẩm
        </button>
    </div>

    <div class="modal fade" id="addBookModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title text-primary">
                        <i class="fa fa-book"></i> Thêm Sách Mới
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <form id="addBookForm" onsubmit="AddBook(event)">

                        <div class="mb-3">
                            <label class="form-label">Tiêu đề</label>
                            <input type="text" class="form-control" name="title" placeholder="Nhập tên sách">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tác giả</label>
                            <input type="text" class="form-control" name="author" placeholder="Nhập tên tác giả">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" name="description" rows="3"
                                placeholder="Mô tả sách"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Giá</label>
                                <input type="number" class="form-control" name="price" placeholder="Giá sách">
                            </div>

                            <input 
                                type="text" 
                                class="form-control" 
                                name="category" 
                                placeholder="Nhập thể loại (VD: Tiểu thuyết, Kỹ năng sống...)"
                            >

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Hình ảnh</label>
                            <input type="file" class="form-control" name="image">
                        </div>

                    </form>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Đóng
                    </button>
                    <button type="submit" class="btn btn-success" form="addBookForm">
                        <i class="fa fa-save"></i> Lưu
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../action.js"></script>
</body>

</html>
